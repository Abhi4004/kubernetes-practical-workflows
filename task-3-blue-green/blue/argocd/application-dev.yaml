apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-tier-app-blue  # ⬅️ Updated name to reflect Blue env
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abhi4004/kubernetes-practical-workflows.git
    targetRevision: task3    # ⬅️ Now looking at new branch
    path: task-3-blue-green/blue  # ⬅️ Pointing to the new Blue folder
    directory:
      recurse: true 
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-green
  namespace: database
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: v2 # ✅ ADDED: Label to differentiate versions
  template:
    metadata:
      labels:
        app: backend
        version: v2 # ✅ ADDED: Label to differentiate versions
    spec:
      # 1. Use an Init Container to handle the installation
      initContainers:
      - name: install-deps
        image: node:18
        workingDir: /app
        command: ["/bin/sh", "-c"]
        args: ["npm install mysql2"]
        volumeMounts:
        - name: node-modules
          mountPath: /app/node_modules

      containers:
        - name: backend
          image: node:18
          workingDir: /app
          command: ["node", "-e"]
          args:
            - |
              const mysql = require('mysql2');
              const http = require('http');
              const fs = require('fs'); // Added fs to test shared volume later
              const dbConfig = {
                host: process.env.DB_HOST,
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_NAME
              };
              const server = http.createServer((req, res) => {
                const db = mysql.createConnection(dbConfig);
                db.query('SELECT 1', (err) => {
                  if (err) {
                    res.statusCode = 500;
                    res.end('Backend: DB connection failed');
                  } else {
                    res.end('Backend: Connected to MySQL');
                  }
                  db.end();
                });
              });
              server.listen(3000, () => console.log('Backend running on port 3000'));
          env:
            - name: DB_HOST
              value: mysql-green.database.svc.cluster.local
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-green
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-green
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-green
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3000
          volumeMounts:
          - name: node-modules
            mountPath: /app/node_modules
          # ✅ ADDED: Mount point for inter-pod file sharing (Task 2)
          - name: shared-storage
            mountPath: /var/www/shared-data

      # 3. Shared volumes
      volumes:
      - name: node-modules
        emptyDir: {}
      # ✅ ADDED: Reference to the Filestore PVC
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-data-pvc

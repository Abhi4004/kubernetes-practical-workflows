apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-tier-app-green
  namespace: argocd
spec:
  project: default
  source:
    # Use your specific repository URL
    repoURL: https://github.com/Abhi4004/kubernetes-practical-workflows.git
    targetRevision: task3
    path: task-3-blue-green/green # ⬅️ This is the key change
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

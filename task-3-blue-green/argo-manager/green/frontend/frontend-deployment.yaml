apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      version: v2 # ✅ ADDED: Version label for green deployment
  template:
    metadata:
      labels:
        app: frontend
        version: v2 # ✅ ADDED: Version label for green deployment
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config-volume
          configMap:
            name: nginx-config

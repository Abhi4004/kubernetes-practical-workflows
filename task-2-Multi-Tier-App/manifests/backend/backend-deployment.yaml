apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: database
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Backend started";
              echo "Using DB credentials from Kubernetes Secret";
              echo "DB_HOST=$DB_HOST";
              echo "DB_NAME=$DB_NAME";
              echo "DB_USER=$DB_USER";
              echo "Checking MySQL connectivity...";
              while true; do
                nc -z "$DB_HOST" 3306 \
                  && echo "MySQL reachable" \
                  || echo "Waiting for MySQL...";
                sleep 10;
              done
          env:
            - name: DB_HOST
              value: mysql.database.svc.cluster.local
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD


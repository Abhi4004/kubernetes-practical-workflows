apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: database
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            # ✅ ADDED: Mount point for the shared Filestore volume (Task 2)
            - name: shared-storage
              mountPath: /var/www/shared-data
      
      # ✅ ADDED: Reference to the external Filestore PVC
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-data-pvc

  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
